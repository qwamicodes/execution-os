name: execution-os

services:
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: eos-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command:
      - sh
      - -c
      - >
        until bunx prisma migrate deploy --config packages/database/prisma.config.ts --schema packages/database/prisma/schema.prisma;
        do
          echo "Waiting for database to become ready...";
          sleep 5;
        done
    networks:
      - eos-network
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: eos-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8901}:8901"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: 8901
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8900}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8901/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eos-network

  auth:
    build:
      context: ../..
      dockerfile: apps/auth/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8901}
        VITE_DASHBOARD_URL: ${VITE_DASHBOARD_URL:-http://localhost:8903}
        APP_PORT: ${AUTH_CONTAINER_PORT:-8902}
    container_name: eos-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8902}:${AUTH_CONTAINER_PORT:-8902}"
    environment:
      PORT: ${AUTH_CONTAINER_PORT:-8902}
    networks:
      - eos-network

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8901}
        VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:8902}
        APP_PORT: ${DASHBOARD_CONTAINER_PORT:-8903}
    container_name: eos-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8903}:${DASHBOARD_CONTAINER_PORT:-8903}"
    environment:
      PORT: ${DASHBOARD_CONTAINER_PORT:-8903}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eos-network

networks:
  eos-network:
    external: true
    name: eos-network
