name: Deploy Staging

on:
  workflow_run:
    workflows: [continuous-integration]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  push-images:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, auth, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:staging
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [push-images]
    steps:
      - name: Placeholder — deploy to staging
        run: |
          echo "Deploy staging images to your hosting provider"
          echo "API: ghcr.io/${{ github.repository }}/api:staging"
          echo "Web: ghcr.io/${{ github.repository }}/web:staging"
          echo "Auth: ghcr.io/${{ github.repository }}/auth:staging"
          echo "Dashboard: ghcr.io/${{ github.repository }}/dashboard:staging"
          # TODO: Add your deployment commands here (SSH, kubectl, etc.)
