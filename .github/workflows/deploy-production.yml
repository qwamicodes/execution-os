name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  push-images:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, auth, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:production
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [push-images]
    environment: production
    steps:
      - name: Placeholder — deploy to production
        run: |
          echo "Deploy production images to your hosting provider"
          echo "API: ghcr.io/${{ github.repository }}/api:production"
          echo "Web: ghcr.io/${{ github.repository }}/web:production"
          echo "Auth: ghcr.io/${{ github.repository }}/auth:production"
          echo "Dashboard: ghcr.io/${{ github.repository }}/dashboard:production"
          # TODO: Add your deployment commands here (SSH, kubectl, etc.)
